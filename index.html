<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý lấy mẫu vật liệu</title>
<style>
  :root{
    --navy:#152A43; --navy-2:#1E3A5C; --slate:#3D6B8C;
    --paper:#F6F4EE; --card:#FFFFFF; --ink:#22262B; --ink-soft:#5B6470;
    --line:#DEDACB; --amber:#B9770A; --amber-bg:#FBF0DC;
    --green:#2F7A45; --green-bg:#E4F3E6; --red:#B23A2E; --red-bg:#FBE7E3;
    --blue-bg:#E7EEF4; --radius:6px;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--sans);background:var(--paper);color:var(--ink);}
  .mono{font-family:var(--mono);}
  #app{display:flex;min-height:100vh;}
  .sidebar{width:236px;flex:none;background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:20px 0;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;}
  .brand{padding:0 20px 18px 20px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px;}
  .brand-title{font-weight:700;font-size:15px;line-height:1.3;}
  .brand-sub{font-size:11px;color:#9FB4C9;margin-top:4px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:11px 20px;font-size:13.5px;color:#C9D7E4;cursor:pointer;border-left:3px solid transparent;user-select:none;}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
  .nav-item.active{background:rgba(255,255,255,.09);color:#fff;border-left-color:var(--amber);font-weight:600;}
  .nav-icon{width:16px;text-align:center;font-size:14px;}
  .main{flex:1;padding:26px 34px 60px 34px;max-width:1180px;}
  .page-header{margin-bottom:22px;}
  .page-title{font-size:21px;font-weight:700;margin:0 0 4px 0;}
  .page-desc{font-size:13px;color:var(--ink-soft);margin:0;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;}
  .card-title{font-size:14px;font-weight:700;margin:0 0 12px 0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  .stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
  .stat-num{font-family:var(--mono);font-size:24px;font-weight:700;line-height:1;}
  .stat-label{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
  .stat.amber .stat-num{color:var(--amber);}
  .stat.green .stat-num{color:var(--green);}
  .stat.red .stat-num{color:var(--red);}
  .stat.navy .stat-num{color:var(--navy-2);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11px;color:var(--ink-soft);font-weight:600;border-bottom:1px solid var(--line);padding:8px 10px;}
  td{padding:9px 10px;border-bottom:1px solid #EFECE0;vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#FAF9F4;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
  .badge.pending{background:var(--amber-bg);color:var(--amber);}
  .badge.taken{background:var(--blue-bg);color:var(--slate);}
  .badge.pass{background:var(--green-bg);color:var(--green);}
  .badge.fail{background:var(--red-bg);color:var(--red);}
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--navy-2);color:#fff;border:none;padding:8px 14px;border-radius:var(--radius);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn:hover{background:var(--navy);}
  .btn.secondary{background:#fff;color:var(--navy-2);border:1px solid var(--line);}
  .btn.secondary:hover{background:#F1EFE6;}
  .btn.danger{background:#fff;color:var(--red);border:1px solid #E7C6C1;}
  .btn.danger:hover{background:var(--red-bg);}
  .btn.small{padding:5px 10px;font-size:11.5px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin:10px 0 5px 0;}
  input[type=text],input[type=date],input[type=number],select,textarea{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:5px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--slate);outline-offset:0;border-color:var(--slate);}
  textarea{resize:vertical;min-height:50px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px;}
  .form-actions{margin-top:16px;display:flex;gap:8px;}
  .empty{padding:30px 10px;text-align:center;color:var(--ink-soft);font-size:13px;}
  .muted{color:var(--ink-soft);font-size:12px;}
  .row-flex{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .criteria-row{display:grid;grid-template-columns:1.4fr .8fr .6fr 1fr .6fr auto;gap:8px;align-items:center;margin-bottom:6px;}
  .criteria-row input[type=text]{padding:6px 8px;font-size:12.5px;}
  .chk{width:16px;height:16px;}
  .filter-bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .filter-bar select,.filter-bar input{width:auto;min-width:150px;}
  .lot-header{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px;}
  .lot-name{font-weight:700;font-size:14px;}
  .lot-meta{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}
  .slot-list{margin-top:8px;}
  .slot{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:5px;margin-bottom:6px;background:#FCFBF7;flex-wrap:wrap;gap:8px;}
  .slot-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .progress-item{border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:10px;background:#FCFBF7;}
  .progress-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .progress-name{font-weight:700;font-size:14px;}
  .progress-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .progress-nums{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);white-space:nowrap;}
  .progress-bar{width:100%;height:9px;border-radius:5px;background:#EDEADD;overflow:hidden;}
  .progress-fill{height:100%;background:var(--green);transition:width .25s ease;}
  .progress-fill.warn{background:var(--amber);}
  .freq-chip{font-family:var(--mono);font-size:11px;font-weight:700;background:var(--navy-2);color:#fff;border-radius:4px;padding:3px 7px;}
  .close-x{cursor:pointer;color:var(--ink-soft);font-size:16px;background:none;border:none;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(20,25,32,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto;z-index:50;}
  .modal{background:#fff;border-radius:8px;max-width:640px;width:100%;padding:22px 24px;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .modal-title{font-size:15px;font-weight:700;}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:6px;font-size:12.5px;z-index:60;max-width:340px;}
  @media (max-width: 760px){
    #app{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px;}
    .brand{display:none;}
    .nav-item{border-left:none;border-bottom:3px solid transparent;white-space:nowrap;padding:8px 12px;}
    .nav-item.active{border-left-color:transparent;border-bottom-color:var(--amber);}
    .main{padding:18px;}
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .grid2,.grid3{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>
<script>
const STORAGE_KEY = 'qlvl_data_v1_opt';
const TABS = [
  {id:'dashboard', label:'Tổng quan', icon:'▤'},
  {id:'materials', label:'Danh mục vật liệu', icon:'▣'},
  {id:'lots', label:'Khối lượng nhập hàng', icon:'▦'},
  {id:'sampling', label:'Thông tin lấy mẫu vật liệu', icon:'●'},
  {id:'results', label:'Danh mục theo dõi lấy mẫu vật liệu', icon:'✓'},
  {id:'excel', label:'Nhập từ Excel', icon:'⇅'},
];

let DB = null;
let state = { tab:'dashboard', filters:{} };
let activeModal = null;

function uid(p){ return (p||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return (s===undefined||s===null?'':s).toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function val(id){ return document.getElementById(id).value.trim(); }
function freqLabel(n){ return 'Tần suất ' + String(n).padStart(2,'0'); }

function defaultData(){
  return {
    materials:[
      {id:uid('mat'), name:'Đất đắp nền đường', unit:'m³', freqQty:1000, freqNote:'Đối chiếu TCVN / hồ sơ thiết kế dự án để điều chỉnh.', criteria:['Độ chặt đầm nén K','Độ ẩm','Thành phần hạt']},
      {id:uid('mat'), name:'Cấp phối đá dăm (móng đường)', unit:'m³', freqQty:200, freqNote:'Đối chiếu TCVN / hồ sơ thiết kế dự án để điều chỉnh.', criteria:['Thành phần hạt','CBR','Độ chặt K','Chỉ số dẻo']},
      {id:uid('mat'), name:'Bê tông nhựa (BTN)', unit:'tấn', freqQty:200, freqNote:'Đối chiếu TCVN / hồ sơ thiết kế dự án để điều chỉnh.', criteria:['Độ ổn định Marshall','Độ rỗng dư','Hàm lượng nhựa','Chiều dày lớp']},
      {id:uid('mat'), name:'Bê tông xi măng (mặt đường/vỉa hè)', unit:'m³', freqQty:100, freqNote:'Đối chiếu TCVN / hồ sơ thiết kế dự án để điều chỉnh.', criteria:['Cường độ nén R7','Cường độ nén R28','Độ sụt']},
      {id:uid('mat'), name:'Cát xây dựng / cát đắp', unit:'m³', freqQty:300, freqNote:'Đối chiếu TCVN / hồ sơ thiết kế dự án để điều chỉnh.', criteria:['Mô đun độ lớn','Hàm lượng bùn, sét, tạp chất']},
      {id:uid('mat'), name:'Đá dăm (base/subbase)', unit:'m³', freqQty:300, freqNote:'Đối chiếu TCVN / hồ sơ thiết kế dự án để điều chỉnh.', criteria:['Thành phần hạt','Độ hao mòn Los Angeles']},
      {id:uid('mat'), name:'Cống bê tông ly tâm', unit:'ống', freqQty:100, freqNote:'Đối chiếu TCVN / hồ sơ thiết kế dự án để điều chỉnh.', criteria:['Cường độ nén','Kích thước hình học']},
      {id:uid('mat'), name:'Gạch / đan lát vỉa hè', unit:'m²', freqQty:500, freqNote:'Đối chiếu TCVN / hồ sơ thiết kế dự án để điều chỉnh.', criteria:['Cường độ chịu uốn','Độ hút nước']},
    ],
    lots:[], samples:[], results:[]
  };
}

/* ---------- storage (browser localStorage — works fully offline, on any device) ---------- */
async function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      DB = JSON.parse(raw);
      if(migrateSamplesIfNeeded()) saveData();
    }
    else { DB = defaultData(); saveData(); }
  }catch(e){
    console.error(e);
    DB = defaultData();
    try{ saveData(); }catch(e2){}
  }
}
function saveData(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }
  catch(e){ console.error(e); showToast('Không lưu được dữ liệu (bộ nhớ trình duyệt có thể đã đầy).'); }
}
function persist(){ renderMain(); saveData(); }
function showToast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2200);
}

/* ---------- helpers ---------- */
function materialById(id){ return DB.materials.find(m=>m.id===id); }
function lotById(id){ return DB.lots.find(l=>l.id===id); }
function sampleById(id){ return DB.samples.find(s=>s.id===id); }
function sampleStatus(s){
  if(s.status==='chua_lay') return {key:'pending', label:'Chưa lấy mẫu'};
  if(s.soKQTN && s.soKQTN.trim()!=='') return {key:'pass', label:'Đã có KQTN'};
  return {key:'taken', label:'Đã lấy mẫu — chưa có KQTN'};
}
function normSupplierKey(s){ return (s||'').trim().toLowerCase(); }

/** Tần suất giờ thuộc về một NHÓM (vật liệu + nhà cung cấp), không thuộc riêng từng đợt nhập hàng — nhờ vậy nhiều đợt nhập cùng vật liệu/NCC sẽ dùng chung một dãy số tần suất liên tục 1,2,3... */
function samplesForGroup(materialId, supplier){
  const key = normSupplierKey(supplier);
  return DB.samples.filter(s=>s.materialId===materialId && normSupplierKey(s.supplier)===key).sort((a,b)=>a.freqIndex-b.freqIndex);
}
/** Distinct (vật liệu + nhà cung cấp) pairs that have at least one delivery batch or sample, used to build the roll-up tables and the Sampling tab cards. */
function materialSupplierGroupsInUse(){
  const map = {};
  DB.lots.forEach(l=>{
    const supplier = (l.supplier||'').trim();
    const key = l.materialId+'|'+normSupplierKey(supplier);
    if(!map[key]) map[key] = { materialId:l.materialId, supplier };
  });
  DB.samples.forEach(s=>{
    if(!s.materialId) return;
    const supplier = (s.supplier||'').trim();
    const key = s.materialId+'|'+normSupplierKey(supplier);
    if(!map[key]) map[key] = { materialId:s.materialId, supplier };
  });
  return Object.values(map).sort((a,b)=>{
    const ma = materialById(a.materialId), mb = materialById(b.materialId);
    return (ma?ma.name:'').localeCompare(mb?mb.name:'') || a.supplier.localeCompare(b.supplier);
  });
}
/** Cumulative quantity, required sample count, taken/remaining — summed across every đợt nhập hàng of one vật liệu + nhà cung cấp (matched case/whitespace-insensitively). */
function aggregateForGroup(materialId, supplier){
  const mat = materialById(materialId);
  const key = normSupplierKey(supplier);
  const lots = DB.lots.filter(l=>l.materialId===materialId && normSupplierKey(l.supplier)===key);
  const totalQty = lots.reduce((a,l)=>a+(parseFloat(l.quantity)||0),0);
  const allSamples = samplesForGroup(materialId, supplier);
  const taken = allSamples.filter(s=>s.status!=='chua_lay').length;
  const requiredTotal = (mat && mat.freqQty>0) ? Math.max(1, Math.ceil(totalQty/mat.freqQty)) : null;
  const remaining = requiredTotal===null ? null : Math.max(0, requiredTotal-taken);
  return { mat, supplier, totalQty, requiredTotal, taken, remaining, lotsCount: lots.length };
}
/** How many tần suất a group should have right now: driven by quantity/định mức when known, otherwise at least one per đợt nhập hàng. */
function requiredForGroup(materialId, supplier){
  const agg = aggregateForGroup(materialId, supplier);
  if(agg.requiredTotal!==null) return agg.requiredTotal;
  return Math.max(1, agg.lotsCount);
}
/** Grows or shrinks a group's tần suất list to match requiredForGroup(), continuing the numbering (never restarting at 1 per đợt nhập hàng). Shrinking only ever removes tần suất that haven't been lấy mẫu yet, then renumbers the rest so there are no gaps. */
function ensureSlotsForGroup(materialId, supplier){
  const required = requiredForGroup(materialId, supplier);
  const existing = samplesForGroup(materialId, supplier);
  if(existing.length < required){
    for(let i=existing.length+1;i<=required;i++){
      DB.samples.push({id:uid('smp'), materialId, supplier, freqIndex:i, sampleCode:'', location:'', dateTaken:'', personTaken:'', quantity:'', soKQTN:'', phongThiNghiem:'', ngayKQTN:'', note:'', status:'chua_lay'});
    }
  } else if(existing.length > required){
    const removable = existing.filter(s=>s.status==='chua_lay').sort((a,b)=>b.freqIndex-a.freqIndex);
    const removeIds = removable.slice(0, existing.length-required).map(s=>s.id);
    if(removeIds.length>0){
      DB.samples = DB.samples.filter(s=>!removeIds.includes(s.id));
      samplesForGroup(materialId, supplier).forEach((s,idx)=>{ s.freqIndex = idx+1; });
    }
  }
}
/** One-time migration: older saved data had tần suất attached to a single lotId. Converts those samples to the new materialId+supplier group model and renumbers them continuously, without deleting anything. */
function migrateSamplesIfNeeded(){
  let changed = false;
  DB.samples.forEach(s=>{
    if(s.materialId===undefined){
      const lot = s.lotId? lotById(s.lotId) : null;
      s.materialId = lot? lot.materialId : (DB.materials[0]?.id || '');
      s.supplier = lot? (lot.supplier||'') : '';
      changed = true;
    }
  });
  if(changed){
    const groups = {};
    DB.samples.forEach(s=>{
      const key = s.materialId+'|'+normSupplierKey(s.supplier);
      if(!groups[key]) groups[key] = [];
      groups[key].push(s);
    });
    Object.values(groups).forEach(arr=>{
      arr.sort((a,b)=>(a.freqIndex||0)-(b.freqIndex||0));
      arr.forEach((s,idx)=>{ s.freqIndex = idx+1; });
    });
  }
  return changed;
}

/* ==========================================================
   RENDER ARCHITECTURE — sidebar renders once, #main redraws
   per tab, and modals live entirely outside the render cycle
   so typing inside a form never gets interrupted mid-keystroke.
   ========================================================== */
function renderSidebar(){
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = `
    <div class="brand">
      <div class="brand-title">Quản lý lấy mẫu vật liệu</div>
      <div class="brand-sub">Hạ tầng đường đô thị</div>
    </div>
    ${TABS.map(t=>`<div class="nav-item ${state.tab===t.id?'active':''}" data-tab="${t.id}"><span class="nav-icon">${t.icon}</span>${t.label}</div>`).join('')}
  `;
  sidebar.addEventListener('click', (e)=>{
    const item = e.target.closest('.nav-item'); if(!item) return;
    if(state.tab === item.dataset.tab) return;
    state.tab = item.dataset.tab;
    sidebar.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active', el.dataset.tab===state.tab));
    renderMain();
  });
}
function renderMain(){
  const main = document.getElementById('main');
  if(state.tab==='dashboard') renderDashboard(main);
  else if(state.tab==='materials') renderMaterials(main);
  else if(state.tab==='lots') renderLots(main);
  else if(state.tab==='sampling') renderSampling(main);
  else if(state.tab==='results') renderResults(main);
  else if(state.tab==='excel') renderExcel(main);
}

/* ---------- DASHBOARD ---------- */
function renderDashboard(main){
  const all = DB.samples;
  const total = all.length;
  const pending = all.filter(s=>s.status==='chua_lay').length;
  const taken = all.filter(s=>{const st=sampleStatus(s); return st.key==='taken';}).length;
  const hasKQTN = all.filter(s=>{const st=sampleStatus(s); return st.key==='pass';}).length;

  const f = state.filters;
  let rows = all.map(s=>{
    const mat = s.materialId? materialById(s.materialId): null;
    const st = sampleStatus(s);
    return {s, mat, st};
  });
  if(f.materialId) rows = rows.filter(r=>r.s.materialId===f.materialId);
  if(f.status) rows = rows.filter(r=>r.st.key===f.status);

  const groupMap = {};
  rows.forEach(r=>{
    const key = r.mat? r.mat.id : '_khac';
    if(!groupMap[key]) groupMap[key] = { mat:r.mat, items:[] };
    groupMap[key].items.push(r);
  });
  const groups = Object.values(groupMap).sort((a,b)=> (a.mat?a.mat.name:'').localeCompare(b.mat?b.mat.name:''));

  main.innerHTML = `
    <div class="page-header">
      <h1 class="page-title">Tổng quan theo dõi tần suất</h1>
      <p class="page-desc">Trạng thái lấy mẫu và kết quả thí nghiệm trên toàn bộ các đợt nhập hàng.</p>
    </div>
    <div class="stat-grid">
      <div class="stat navy"><div class="stat-num">${total}</div><div class="stat-label">Tổng số tần suất</div></div>
      <div class="stat amber"><div class="stat-num">${pending}</div><div class="stat-label">Chưa lấy mẫu</div></div>
      <div class="stat" style="border-color:var(--line)"><div class="stat-num" style="color:var(--slate)">${taken}</div><div class="stat-label">Đã lấy mẫu — chưa KQTN</div></div>
      <div class="stat green"><div class="stat-num">${hasKQTN}</div><div class="stat-label">Đã có KQTN</div></div>
    </div>
    <div class="card">
      <div class="card-title">Bảng theo dõi chi tiết</div>
      <div class="filter-bar">
        <select id="f-material">
          <option value="">Tất cả vật liệu</option>

    if(!ok) return;

function openMaterialModal(id){

function openLotModal(id){
  const l = id? lotById(id) : {id:uid('lot'), materialId:DB.materials[0]?.id||'', name:'', supplier:'', location:'', quantity:'', freqCount:1, startDate:''};
  openModal({
    title: id? 'Sửa đợt nhập hàng' : 'Thêm đợt nhập hàng',
    focusId: 'l-qty',
    body: `
      <div class="grid2">
        <div><label>Vật liệu</label>
          <select id="l-mat">${DB.materials.map(m=>`<option value="${m.id}" ${l.materialId===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select>
        </div>
        <div><label>Nhà cung cấp</label><input type="text" id="l-supplier" list="dl-suppliers" value="${esc(l.supplier)}" placeholder="VD: Công ty CP VLXD ABC"></div>
      </div>
      <datalist id="dl-suppliers">${distinctSuppliers().map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
      <div class="grid2">
        <div><label>Vị trí nhập hàng (phân khu)</label><input type="text" id="l-loc" value="${esc(l.location)}" placeholder="VD: Phân khu A / Km0+000 - Km0+500"></div>
        <div><label>Ngày nhập hàng về</label><input type="date" id="l-date" value="${esc(l.startDate)}"></div>
      </div>
      <label>Khối lượng</label>
      <input type="number" min="0" step="any" id="l-qty" value="${l.quantity}" placeholder="VD: 1200">
      <div class="muted" id="l-freq-preview" style="margin-top:10px;padding:8px 10px;background:#FBFAF5;border:1px solid var(--line);border-radius:5px;"></div>
    `,
    afterRender: (modalEl)=>{
      const matSel = modalEl.querySelector('#l-mat');
      const qtyInput = modalEl.querySelector('#l-qty');
      const supplierInput = modalEl.querySelector('#l-supplier');
      const preview = modalEl.querySelector('#l-freq-preview');
      function updatePreview(){
        const materialId = matSel.value;
        const supplier = supplierInput.value;
        const mat = materialById(materialId);
        const qty = parseFloat(qtyInput.value) || 0;
        const key = normSupplierKey(supplier);
        const otherLots = DB.lots.filter(x=>x.materialId===materialId && normSupplierKey(x.supplier)===key && x.id!==l.id);
        const existingTotal = otherLots.reduce((a,x)=>a+(parseFloat(x.quantity)||0),0);
        const newTotal = existingTotal + qty;
        const existingCount = samplesForGroup(materialId, supplier).length;
        let required;
        if(mat && mat.freqQty>0) required = Math.max(1, Math.ceil(newTotal/mat.freqQty));
        else required = Math.max(1, otherLots.length+1);
        const diff = required - existingCount;
        preview.innerHTML = `Nhóm <b>"${mat?esc(mat.name):''} — ${esc(supplier)||'chưa rõ NCC'}"</b> sau khi lưu: tổng khối lượng <b>${newTotal}</b> ${mat?esc(mat.unit):''} → cần <b>${required}</b> tần suất`
          + (mat&&mat.freqQty>0? ` (định mức ${mat.freqQty} ${esc(mat.unit)}/mẫu)` : ' (vật liệu chưa có định mức, tạm tính 1 tần suất/đợt)')
          + `. Hiện nhóm đang có ${existingCount} tần suất — `
          + (diff>0? `sẽ <b>thêm ${diff}</b> tần suất mới, đánh số tiếp theo.` : diff<0? `dư ${-diff} tần suất (chỉ rút bớt các tần suất chưa lấy mẫu).` : `đã đủ, không đổi.`);
      }
      matSel.addEventListener('change', updatePreview);
      qtyInput.addEventListener('input', updatePreview);
      supplierInput.addEventListener('input', updatePreview);
      updatePreview();
    },
    onSave: ()=>{
      const materialId = document.getElementById('l-mat').value;
      const quantity = parseFloat(document.getElementById('l-qty').value) || 0;
      if(quantity<=0){ showToast('Vui lòng nhập khối lượng lớn hơn 0'); return false; }
      const mat = materialById(materialId);
      const oldMaterialId = l.materialId, oldSupplier = l.supplier;
      l.materialId = materialId;
      l.name = `${mat?mat.name:'Vật liệu'} — ${document.getElementById('l-date').value || 'chưa có ngày'}`;
      l.supplier = val('l-supplier');
      l.location = val('l-loc');
      l.quantity = quantity;
      l.startDate = document.getElementById('l-date').value;
      if(!id) DB.lots.push(l);
      // Recompute slots for the (possibly new) group this lot now belongs to...
      ensureSlotsForGroup(l.materialId, l.supplier);
      // ...and also for its old group, in case editing moved it to a different vật liệu/nhà cung cấp.
      if(id && (oldMaterialId!==l.materialId || normSupplierKey(oldSupplier)!==normSupplierKey(l.supplier))){
        ensureSlotsForGroup(oldMaterialId, oldSupplier);
      }
      persist();
      return true;
    }
  });
}

function deleteSample(sampleId){
  const s = sampleById(sampleId);
  if(!s) return;

  showToast('Đã xoá.');
}

/* ==========================================================
   EXCEL IMPORT
   One flat sheet, one row per tần suất (sampling event) — optionally
   sampled). Headers are matched loosely (case/diacritic/spacing
   insensitive) so the exact template isn't mandatory. Import is
   additive: it matches existing lots/samples where it reasonably
   can and otherwise adds new ones — it never deletes anything.
   ========================================================== */
const XLSX_SOURCES = [
  'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
  'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js'
];
let xlsxStatus = 'loading'; // 'loading' | 'ready' | 'failed'
let xlsxStatusListeners = [];
function onXlsxStatusChange(fn){ xlsxStatusListeners.push(fn); }
function setXlsxStatus(s){ xlsxStatus = s; xlsxStatusListeners.forEach(fn=>fn(s)); }
function loadXlsxLib(sourceIndex){
  sourceIndex = sourceIndex || 0;
  if(typeof XLSX !== 'undefined'){ setXlsxStatus('ready'); return; }
  if(sourceIndex >= XLSX_SOURCES.length){ setXlsxStatus('failed'); return; }
  const s = document.createElement('script');
  s.src = XLSX_SOURCES[sourceIndex];
  s.onload = ()=>{ if(typeof XLSX !== 'undefined') setXlsxStatus('ready'); else loadXlsxLib(sourceIndex+1); };
  s.onerror = ()=> loadXlsxLib(sourceIndex+1);
  document.head.appendChild(s);
}
loadXlsxLib();

const EXCEL_TEMPLATE_HEADERS = ['Vật liệu','Nhà cung cấp','Khối lượng','Ngày nhập','Vị trí/phân khu','Số BBNT','Người lấy mẫu','Ngày lấy mẫu','Số KQTN','Phòng thí nghiệm','Ngày có KQTN'];
const EXCEL_HEADER_MAP = {
  vatLieu:['vatlieu'], nhaCungCap:['nhacungcap','ncc'], khoiLuong:['khoiluong'],
  ngayNhap:['ngaynhap'], viTri:['vitriphankhu','vitri','phankhu'],
  soBBNT:['sobbnt','bbnt','mamau'], nguoiLayMau:['nguoilaymau'], ngayLayMau:['ngaylaymau'],
  soKQTN:['sokqtn'], phongThiNghiem:['phongthinghiem'], ngayCoKQTN:['ngaycokqtn','ngaycoketqua']
};
function normKey(h){ return stripDiacritics(String(h||'')).toLowerCase().replace(/[^a-z0-9]/g,''); }
function stripDiacritics(str){ return str.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D'); }
function mapExcelHeaders(headers){
  const norm = headers.map(normKey);
  const out = {};
  Object.keys(EXCEL_HEADER_MAP).forEach(field=>{
    let idx=-1;
    for(const c of EXCEL_HEADER_MAP[field]){ idx = norm.indexOf(c); if(idx!==-1) break; }
    out[field]=idx;
  });
  return out;
}
function excelToISODate(v){
  if(v===undefined||v===null||v==='') return '';
  if(v instanceof Date && !isNaN(v)){
    const y=v.getFullYear(), m=String(v.getMonth()+1).padStart(2,'0'), d=String(v.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  const s = String(v).trim();
  if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)){ const [y,m,d]=s.split('-'); return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`; }
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)){ const [d,m,y]=s.split('/'); return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`; }
  return s;
}
function downloadExcelTemplate(){
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([
    EXCEL_TEMPLATE_HEADERS,
    ['Cấp phối đá dăm (móng đường)','Công ty CP VLXD ABC',250,'2026-09-01','Phân khu A','BBNT-01','Trần Văn B','2026-09-02','KQTN-01','LAS-XD 123','2026-09-06'],
    ['Cấp phối đá dăm (móng đường)','Công ty CP VLXD ABC',200,'2026-09-10','Phân khu A','','','','','','']
  ]);
  XLSX.utils.book_append_sheet(wb, ws, 'DuLieu');
  XLSX.writeFile(wb, 'mau_nhap_du_lieu.xlsx');
}
function findOrCreateMaterialByName(name){
  name = (name||'').toString().trim();
  if(!name) return null;
  let mat = DB.materials.find(m=>normSupplierKey(m.name)===normSupplierKey(name));
  if(!mat){ mat = {id:uid('mat'), name, unit:'', freqQty:0, freqNote:'', criteria:[]}; DB.materials.push(mat); }
  return mat;
}
function importFromExcelRows(rows, idx){
  const report = { materialsAdded:0, lotsAdded:0, lotsMatched:0, samplesAdded:0, samplesUpdated:0, skipped:0 };
  rows.forEach(r=>{
    const vatLieuName = idx.vatLieu!==-1? (r[idx.vatLieu]||'').toString().trim() : '';
    const nhaCungCap = idx.nhaCungCap!==-1? (r[idx.nhaCungCap]||'').toString().trim() : '';
    if(!vatLieuName || !nhaCungCap){ report.skipped++; return; }
    const matBefore = DB.materials.length;
    const mat = findOrCreateMaterialByName(vatLieuName);
    if(DB.materials.length>matBefore) report.materialsAdded++;

    const khoiLuong = idx.khoiLuong!==-1? (parseFloat(r[idx.khoiLuong])||0) : 0;
    const ngayNhap = idx.ngayNhap!==-1? excelToISODate(r[idx.ngayNhap]) : '';
    const viTri = idx.viTri!==-1? (r[idx.viTri]||'').toString().trim() : '';

    // Ghi nhận khối lượng nhập hàng (chỉ để theo dõi tổng khối lượng ở tab "Khối lượng nhập hàng"
    // — KHÔNG dùng để tự tính số tần suất nữa, vì mỗi dòng Excel giờ luôn ứng với đúng 1 tần suất).
    if(khoiLuong>0){
      let lot = DB.lots.find(l=>l.materialId===mat.id && normSupplierKey(l.supplier)===normSupplierKey(nhaCungCap) && l.startDate===ngayNhap && Number(l.quantity)===khoiLuong);
      if(!lot){
        lot = {id:uid('lot'), materialId:mat.id, name:`${mat.name} — ${ngayNhap||'chưa có ngày'}`, supplier:nhaCungCap, location:viTri, quantity:khoiLuong, startDate:ngayNhap, freqCount:1};
        DB.lots.push(lot);
        report.lotsAdded++;
      } else {
        report.lotsMatched++;
      }
    }

    // Mỗi dòng = đúng 1 tần suất, đánh số tiếp theo trong nhóm vật liệu + nhà cung cấp.
    const soBBNT = idx.soBBNT!==-1? (r[idx.soBBNT]||'').toString().trim() : '';
    const ngayLayMau = idx.ngayLayMau!==-1? excelToISODate(r[idx.ngayLayMau]) : '';
    const nguoiLayMau = idx.nguoiLayMau!==-1? (r[idx.nguoiLayMau]||'').toString().trim() : '';
    const soKQTN = idx.soKQTN!==-1? (r[idx.soKQTN]||'').toString().trim() : '';
    const phongThiNghiem = idx.phongThiNghiem!==-1? (r[idx.phongThiNghiem]||'').toString().trim() : '';
    const ngayCoKQTN = idx.ngayCoKQTN!==-1? excelToISODate(r[idx.ngayCoKQTN]) : '';

    let sample = null;
    if(soBBNT){
      // Có Số BBNT trùng với tần suất đã nhập trước đó → cập nhật, tránh tạo trùng khi nhập lại file.
      sample = samplesForGroup(mat.id, nhaCungCap).find(s=>s.sampleCode && normSupplierKey(s.sampleCode)===normSupplierKey(soBBNT));
    }
    if(sample){
      report.samplesUpdated++;
    } else {
      const group = samplesForGroup(mat.id, nhaCungCap);
      const nextIdx = group.length>0? group[group.length-1].freqIndex+1 : 1;
      sample = {id:uid('smp'), materialId:mat.id, supplier:nhaCungCap, freqIndex:nextIdx, sampleCode:'', location:'', dateTaken:'', personTaken:'', quantity:'', soKQTN:'', phongThiNghiem:'', ngayKQTN:'', note:'', status:'chua_lay'};
      DB.samples.push(sample);
      report.samplesAdded++;
    }
      if(soBBNT) sample.sampleCode = soBBNT;
      if(viTri) sample.location = viTri;
      if(nguoiLayMau) sample.personTaken = nguoiLayMau;
      if(ngayLayMau) sample.dateTaken = ngayLayMau;
      if(soKQTN) sample.soKQTN = soKQTN;
      if(phongThiNghiem) sample.phongThiNghiem = phongThiNghiem;
      if(ngayCoKQTN) sample.ngayKQTN = ngayCoKQTN;
      if(khoiLuong>0 && !sample.quantity) sample.quantity = khoiLuong;
      if(ngayLayMau) sample.status = 'da_lay';
  });
  return report;
}

function renderExcel(main){
  main.innerHTML = `
    <div class="page-header">
      <h1 class="page-title">Nhập từ Excel</h1>
      <p class="page-desc">Mỗi dòng trong Excel tương ứng đúng <b>1 tần suất</b> (không tự tính theo khối lượng/định mức nữa). Nếu dòng đó có điền cột Khối lượng/Ngày nhập, app vẫn ghi nhận vào tab "Khối lượng nhập hàng" để theo dõi tổng khối lượng, nhưng không dùng để tính số tần suất.</p>
    </div>
    <div class="card" id="xlsx-status-card" style="display:flex;align-items:center;gap:10px;"></div>
    <div class="card">
      <div class="card-title">1. Tải file mẫu Excel</div>
      <p class="muted">Có sẵn tiêu đề đúng cột và 1-2 dòng ví dụ — bạn điền dữ liệu của mình vào các dòng bên dưới, giữ nguyên dòng tiêu đề.</p>
      <button class="btn secondary" id="btn-template">⬇ Tải file mẫu Excel</button>
    </div>
    <div class="card">

      <p class="muted">Hỗ trợ .xlsx, .xlsm, .xls. Dữ liệu trùng (cùng vật liệu, NCC, ngày, khối lượng / cùng Số BBNT) sẽ được cập nhật thay vì tạo trùng lặp — dữ liệu cũ trong app không bị xoá.</p>
      <input type="file" id="excel-file" accept=".xlsx,.xls,.xlsm">
      <div class="form-actions"><button class="btn" id="btn-import">Nhập dữ liệu vào app</button></div>
      <div id="import-report"></div>
    </div>
  `;
  const statusCard = main.querySelector('#xlsx-status-card');
  function renderStatus(){
    if(xlsxStatus==='loading'){
      statusCard.innerHTML = `<span class="spinner" style="width:16px;height:16px;border-width:2px;margin:0;border-radius:50%;border:2px solid #E1DDC9;border-top-color:var(--navy-2);animation:spin .7s linear infinite;"></span><span class="muted">Đang tải thư viện đọc Excel...</span>`;
    } else if(xlsxStatus==='ready'){
      statusCard.innerHTML = `<span style="color:var(--green);font-weight:600;">✓ Sẵn sàng nhập Excel</span>`;
    } else {
      statusCard.innerHTML = `<span style="color:var(--red);font-weight:600;">✕ Không tải được thư viện Excel — kiểm tra kết nối mạng.</span> <button class="btn secondary small" id="xlsx-retry" style="margin-left:8px;">Thử lại</button>`;
      main.querySelector('#xlsx-retry')?.addEventListener('click', ()=>{ setXlsxStatus('loading'); loadXlsxLib(); });
    }
  }
  renderStatus();
  onXlsxStatusChange(renderStatus);

  function requireReady(){
    if(xlsxStatus==='ready') return true;
    showToast(xlsxStatus==='loading'? 'Thư viện đang tải, đợi vài giây rồi thử lại.' : 'Chưa tải được thư viện, bấm Thử lại ở trên.');
    return false;
  }
  main.querySelector('#btn-template').addEventListener('click', ()=>{ if(requireReady()) downloadExcelTemplate(); });

  const fileInput = main.querySelector('#excel-file');
  const importBtn = main.querySelector('#btn-import');
  importBtn.addEventListener('click', async ()=>{
    if(!requireReady()) return;
    const file = fileInput.files[0];
    if(!file){ showToast('Vui lòng chọn một file Excel trước.'); return; }
    importBtn.disabled = true; importBtn.textContent = 'Đang xử lý...';
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array', cellDates:true});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const grid = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
      if(grid.length<2){ showToast('File không có dữ liệu ở dòng nào sau tiêu đề.'); importBtn.disabled=false; importBtn.textContent='Nhập dữ liệu vào app'; return; }
      const headers = grid[0];
      const idx = mapExcelHeaders(headers);
      if(idx.vatLieu===-1 || idx.nhaCungCap===-1){
        main.querySelector('#import-report').innerHTML = `<div class="card" style="margin-top:12px;"><div class="muted" style="color:var(--red);">Không tìm thấy cột "Vật liệu" và/hoặc "Nhà cung cấp" ở dòng tiêu đề. Hãy dùng file mẫu ở bước 1 làm khuôn.</div></div>`;
        importBtn.disabled = false; importBtn.textContent = 'Nhập dữ liệu vào app';
        return;
      }
      const report = importFromExcelRows(grid.slice(1), idx);
      main.querySelector('#import-report').innerHTML = `
        <div class="card" style="background:#FBFAF5;margin-top:12px;">
          <div class="card-title">Kết quả nhập dữ liệu</div>
          <ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.9;">
            <li>Vật liệu mới tạo: <b>${report.materialsAdded}</b></li>
            <li>Đợt nhập hàng mới: <b>${report.lotsAdded}</b> — đã khớp với đợt có sẵn (không tạo trùng): <b>${report.lotsMatched}</b></li>
            <li>Tần suất mới thêm: <b>${report.samplesAdded}</b></li>
            <li>Tần suất đã khớp Số BBNT có sẵn và cập nhật: <b>${report.samplesUpdated}</b></li>
            <li>Dòng bị bỏ qua (thiếu Vật liệu/Nhà cung cấp): <b>${report.skipped}</b></li>
          </ul>
        </div>
      `;
      persist();
      showToast('Đã nhập dữ liệu từ Excel.');
    }catch(e){
      console.error(e);
      showToast('Không đọc được file này — kiểm tra lại đây có đúng là file Excel hợp lệ không.');
    }
    importBtn.disabled = false; importBtn.textContent = 'Nhập dữ liệu vào app';
    fileInput.value = '';
  });
}

/* ==========================================================
   MODAL — lives entirely outside the tab render cycle so
   typing inside it is never interrupted by a background redraw.
   ========================================================== */
function openModal(config){
  closeModal();
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal" style="${config.wide?'max-width:760px':''}">
      <div class="modal-head">
        <div class="modal-title">${config.title}</div>
        <button class="close-x" id="modal-close">✕</button>
      </div>
      <div id="modal-body">${config.body}</div>
      <div class="form-actions">
        <button class="btn" id="modal-save">Lưu</button>
        <button class="btn secondary" id="modal-cancel">Huỷ</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  const modalEl = backdrop.querySelector('.modal');
  const doClose = ()=>closeModal();
  const doSave = ()=>{ const ok = config.onSave(); if(ok!==false) closeModal(); };
  backdrop.querySelector('#modal-close').addEventListener('click', doClose);
  backdrop.querySelector('#modal-cancel').addEventListener('click', doClose);
  backdrop.querySelector('#modal-save').addEventListener('click', doSave);
  // Deliberately no "click outside" and no Esc-to-close — a stray click or key press
  // shouldn't discard a form in progress. Closing only happens via the ✕ or "Huỷ" button.
  backdrop.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' && (e.target.tagName==='INPUT' || e.target.tagName==='SELECT')){ e.preventDefault(); doSave(); }
  });
  activeModal = { backdrop };
  if(config.afterRender) config.afterRender(modalEl);
  if(config.focusId){
    const el = document.getElementById(config.focusId);
    if(el){ el.focus(); if(el.select) el.select(); }
  }
}
function closeModal(){
  if(activeModal && activeModal.backdrop){ activeModal.backdrop.remove(); }
  activeModal = null;
}

/* ---------- init ---------- */
(async function init(){
  document.getElementById('main').innerHTML = `<div style="padding:60px 20px;text-align:center;color:#5B6470;">Đang tải dữ liệu…</div>`;
  renderSidebar();
  await loadData();
  renderMain();
})();
</script>
